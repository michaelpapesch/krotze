<!--
  Monochrome notification badge — the icon.svg speech bubble as a silhouette.

  Android renders a status-bar badge from the alpha channel alone and tints the
  opaque pixels, so this carries no colour of its own: the bubble is solid, the
  three dots are punched clean through. badge-96.png is generated from this
  geometry for platforms that will not take an SVG.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <mask id="dots">
    <path d="M64 22c-24.3 0-44 16.8-44 37.6 0 11.9 6.5 22.5 16.6 29.4-.8 5.4-3.2 10.5-6.9 14.6a1.8 1.8 0 0 0 1.5 3c8.3-.5 16-3.6 22.1-8.5 3.5.7 7.1 1.1 10.7 1.1 24.3 0 44-16.8 44-37.6S88.3 22 64 22z" fill="#fff"/>
    <circle cx="46" cy="60" r="6" fill="#000"/>
    <circle cx="64" cy="60" r="6" fill="#000"/>
    <circle cx="82" cy="60" r="6" fill="#000"/>
  </mask>
  <rect width="128" height="128" fill="#fff" mask="url(#dots)"/>
</svg>
