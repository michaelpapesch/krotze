<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Krotze anonymous chat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151125"/>
      <stop offset="0.5" stop-color="#0c0a14"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.3" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#glow1)"/>
  <rect width="1600" height="480" fill="url(#glow2)"/>
  <g opacity="0.15" stroke="#a78bfa" stroke-width="1">
    <path d="M0 380 Q 400 300 800 360 T 1600 340" fill="none"/>
    <path d="M0 420 Q 500 340 900 400 T 1600 380" fill="none"/>
  </g>
  <!-- chat bubbles -->
  <g transform="translate(180,120)">
    <rect x="0" y="0" width="300" height="70" rx="24" fill="url(#bub)" opacity="0.95"/>
    <path d="M30 70 l-14 24 34 -24z" fill="#6d28d9"/>
    <circle cx="60" cy="35" r="8" fill="#0c0a14"/>
    <circle cx="100" cy="35" r="8" fill="#0c0a14"/>
    <circle cx="140" cy="35" r="8" fill="#0c0a14"/>
  </g>
  <g transform="translate(320,240)">
    <rect x="0" y="0" width="360" height="70" rx="24" fill="#ffffff" opacity="0.10"/>
    <path d="M330 70 l14 24 -34 -24z" fill="#ffffff" opacity="0.10"/>
    <rect x="30" y="24" width="200" height="10" rx="5" fill="#a78bfa" opacity="0.6"/>
    <rect x="30" y="42" width="140" height="10" rx="5" fill="#a78bfa" opacity="0.35"/>
  </g>
  <!-- incognito mask -->
  <g transform="translate(1150,110)" opacity="0.9">
    <ellipse cx="120" cy="130" rx="150" ry="34" fill="#8b5cf6" opacity="0.25"/>
    <path d="M40 120 q80 -110 160 0 q-30 -18 -80 -18 t-80 18z" fill="#a78bfa" opacity="0.55"/>
    <circle cx="75" cy="150" r="30" fill="none" stroke="#a78bfa" stroke-width="8" opacity="0.7"/>
    <circle cx="165" cy="150" r="30" fill="none" stroke="#a78bfa" stroke-width="8" opacity="0.7"/>
    <path d="M105 150 h30" stroke="#a78bfa" stroke-width="8" opacity="0.7"/>
  </g>
  <!-- QR hint -->
  <g transform="translate(1250,300)" fill="#ffffff" opacity="0.25">
    <rect x="0" y="0" width="26" height="26"/><rect x="34" y="0" width="26" height="26"/>
    <rect x="0" y="34" width="26" height="26"/><rect x="34" y="34" width="12" height="12"/>
    <rect x="48" y="48" width="12" height="12"/><rect x="68" y="0" width="12" height="12"/>
    <rect x="68" y="20" width="12" height="26"/><rect x="0" y="68" width="26" height="12"/>
    <rect x="34" y="68" width="12" height="12"/><rect x="56" y="68" width="24" height="12"/>
  </g>
  <text x="180" y="410" font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Krotze</text>
  <text x="410" y="410" font-family="system-ui, sans-serif" font-size="30" fill="#a78bfa">anonymous chat · no accounts · self-destructing</text>
</svg>
